name: Publish to npm
run-name: 'Publish ${{ github.ref_name }}: ${{ github.event.head_commit.message }}'

on:
  push:
    tags:
      - 'v*'

# id-token: write lets npm trusted publishing authenticate this workflow via OIDC (no npm token)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm >= 11.5.1, which trusted publishing requires
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # never let a dependency cache feed into a release
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prepublishOnly runs `bun run check` (lint, tests, build, Node smoke tests, package check);
      # trusted publishing attaches provenance automatically.
      # NOTE: npm trusted publishing requires the package to exist on npmjs.com first before OIDC can publish.
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_ARG=""
          # any semver prerelease (1.0.0-beta.1, 1.0.0-0, ...) goes to "next", never "latest"
          if [[ "$VERSION" == *-* ]]; then
            TAG_ARG="--tag next"
          fi
          npm publish $TAG_ARG
