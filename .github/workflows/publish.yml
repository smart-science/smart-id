name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# id-token: write lets npm trusted publishing authenticate this workflow via OIDC (no npm token)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing requires npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Verify tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prepublishOnly runs `bun run check` (lint, tests, build, Node smoke tests, package check);
      # trusted publishing attaches provenance automatically
      - name: Publish to npm
        run: npm publish
