name: Test
run-name: 'Test: ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck, and Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run test:types

      - name: Test & Coverage
        shell: bash
        run: set -o pipefail; bun test --coverage --only-failures 2>&1 | tee coverage.txt

      - name: Create Coverage Summary
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            echo "### Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat coverage.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  smoke-node:
    name: Build and Smoke Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19', '22.12', '22', '24']

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun (for building)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (for running)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and Test Dist
        run: bun run build && bun run test:dist
